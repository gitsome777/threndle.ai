      <h1>Threndle AI — every business runs on loose threads, we tie them off.</h1>
      <p>
        Threndle AI is an independent AI implementation consultancy for small businesses,
        based in the Fraser Valley, British Columbia. Cash flow nobody's watching. Leads

        and put those loose ends on autopilot — starting with the one that's costing you

      </p>

      <h2>The diagnostic comes first — always</h2>
      <p>
        We don't sell a package. We ask what's actually eating your week — money, sales,
        marketing, customer service, admin, hiring — and we build around what you tell us,
        not a menu. Three minutes for a straight answer: a clear recommendation on where to
        start, not a pitch.
      </p>

      <h2>How an engagement runs</h2>
      <ol>
        <li><strong>Diagnostic</strong> — you tell us what's actually eating the week, not a menu, your real answer.</li>
        <li><strong>Score</strong> — we weigh how many bottlenecks are stacked up against urgency, hours lost, and budget.</li>
        <li><strong>Proposal</strong> — a fixed-price scope built around your answers, confirmed on a short call before anything's signed.</li>
        <li><strong>Kickoff</strong> — tools connected, first workflow running live against your real data, not a demo.</li>
        <li><strong>Delivery</strong> — trained on it, checked in on at 30 days, ready to scale up whenever you are.</li>
      </ol>

      </p>

      <h2>Frequently asked questions</h2>

      <h3>What does Threndle AI do?</h3>
      <p>
        Threndle AI is an independent AI implementation consultancy for small businesses. We connect Claude to the tools you already use — accounting, CRM, payments, email, files, team ops — and put your biggest operational bottleneck on autopilot.
      </p>

      <h3>Who is Threndle AI for?</h3>
      <p>
        Small business owners and operators in the Fraser Valley and surrounding areas who are losing hours to manual follow-up, stale data, or software that does not talk to each other. We work with businesses that already use tools like QuickBooks, HubSpot, Slack, Google Workspace, Stripe, and Monday.com.
      </p>

      <h3>What happens during the Threndle AI diagnostic?</h3>
      <p>
        We ask what is actually eating your week across money, sales, marketing, customer service, admin, and hiring. In about three minutes you get a straight recommendation on which bottleneck to fix first, not a packaged sales pitch.
      </p>

      <h3>Which tools can Threndle AI connect to Claude?</h3>
      <p>
        We connect accounting tools such as QuickBooks, Xero, Wave, Sage, and Zoho Books; CRMs such as HubSpot, Salesforce, Zoho Bigin, and Pipedrive; payments such as Stripe, PayPal, Square, and QuickBooks Payments; payroll platforms; email and file systems such as Google Workspace, Microsoft 365, Dropbox, and OneDrive; and team tools such as Slack, Monday.com, Asana, ClickUp, and Notion.
      </p>

      <h3>How much does an AI implementation project cost?</h3>
      <p>
        Most engagements start with Foundation, a fixed-price scope for one bottleneck, typically between $3,000 and $3,500. Multi-workflow builds range from $6,000 to $9,000, and ongoing Partner retainers run from $750 to $1,500 per month.
      </p>

      <h3>Where is Threndle AI based?</h3>
      <p>
        Threndle AI is based in the Fraser Valley, British Columbia, Canada. We work with local small businesses and can also support remote engagements across Canada.
      </p>

      <h3>How do I get started with Threndle AI?</h3>
      <p>
        Start with the diagnostic questionnaire on our website, or email <a href="mailto:hello@threndle.ai">hello@threndle.ai</a>. We confirm the scope on a short call before anything is signed, then connect your tools and deliver the first workflow against real data.
      </p>

      <h3>What is Claude Cowork for small business?</h3>
      <p>
        Claude Cowork is Threndle AI's approach to embedding Claude into a small business's daily operations. Instead of replacing staff or switching software, we connect Claude to the tools the business already uses — QuickBooks, HubSpot, Slack, Google Workspace, and others — so it can handle repetitive tasks, surface insights, and keep workflows moving.
      </p>

      <h3>What does Claude Cowork actually mean?</h3>
      <p>
        It means Claude works alongside your team as a digital assistant with access to your real business data. It can reconcile transactions, draft follow-up emails, update CRM records, summarize meetings, and chase overdue invoices — always under your control and always starting from the bottlenecks you choose.
      </p>

      <h3>Is Claude Cowork secure?</h3>
      <p>
        Yes. We do not store your credentials or raw business data on our servers. Claude connects through official APIs and OAuth where available, using read-and-write permissions you approve. You keep ownership of your data, and any automation can be paused or revoked at any time. We also review each integration before it goes live.
      </p>

      <h3>What do I need to get started with Claude Cowork?</h3>
      <p>
        You need the cloud tools you already use, a clear bottleneck you want fixed first, and about an hour for a kickoff call. Most businesses start with one workflow — like invoice reconciliation or lead follow-up — and expand from there. We do the technical setup and train your team.
      </p>

      <h3>Which tools can Claude Cowork connect to?</h3>
      <p>
        Accounting tools such as QuickBooks, Xero, Wave, Sage, and Zoho Books; payments such as Stripe, PayPal, Square, and QuickBooks Payments; payroll platforms; CRMs such as HubSpot, Salesforce, Zoho Bigin, and Pipedrive; email and file systems such as Google Workspace, Microsoft 365, Dropbox, and OneDrive; team and ops tools such as Slack, Monday.com, Asana, ClickUp, and Notion; plus booking, e-commerce, and advertising platforms.
